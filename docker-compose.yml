
services:
  # =========================================================================
  # DATABASE SERVICE
  # =========================================================================
  db:
    image: postgres:18-alpine
    container_name: poc-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: temporary-password-123
      POSTGRES_DB: app
    volumes:
      - postgres-data-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # WIREMOCK SERVICE (WireMock & WireMock UI)
  # =========================================================================
  wiremock:
    image: holomekc/wiremock-gui:latest-alpine
    platform: linux/amd64
    container_name: poc-wiremock
    ports:
      - "8088:8080"
    command:
      - "--disable-banner"
      - "--global-response-templating"
      - "--extensions"
      - "org.wiremock.RandomExtension"
      - "--admin-api-basic-auth"
      - "${WIREMOCK_ADMIN_USER:-admin}:${WIREMOCK_ADMIN_PASSWORD:-password}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://${WIREMOCK_ADMIN_USER:-admin}:${WIREMOCK_ADMIN_PASSWORD:-password}@localhost:8080/__admin/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
      - ./wiremock/__files:/home/wiremock/__files
      - ./wiremock/extensions:/var/wiremock/extensions:ro

  # =========================================================================
  # =========================================================================
  # REAL MICROSERVICES
  # =========================================================================
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: poc-user-service
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: app
      DB_PASSWORD: temporary-password-123
      DB_NAME: app
      PAOTANG_SERVICE_URL: http://wiremock:8080
      PAOTANG_CLIENT_ID: dummy-client-id
      PAOTANG_CLIENT_SECRET: dummy-client-secret
      OTP_SERVICE_URL: http://wiremock:8080
    depends_on:
      db:
        condition: service_healthy
      wiremock:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./services/user-service

  bank-account-service:
    build:
      context: ./services/bank-account-service
      dockerfile: Dockerfile
    container_name: poc-bank-account-service
    ports:
      - "8082:8080"
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: app
      DB_PASSWORD: temporary-password-123
      DB_NAME: app
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./services/bank-account-service

  sms-service:
    build:
      context: ./services/sms-service
      dockerfile: Dockerfile
    container_name: poc-sms-service
    ports:
      - "8086:8080"
    environment:
      PORT: "8080"
      SMS_UPSTREAM_URL: http://wiremock:8080
      SMS_API_KEY: dummy-sms-api-key
    depends_on:
      wiremock:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./services/sms-service

  ekyc-service:
    build:
      context: ./services/ekyc-service
      dockerfile: Dockerfile
    container_name: poc-ekyc-service
    ports:
      - "8084:8080"
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: app
      DB_PASSWORD: temporary-password-123
      DB_NAME: app
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./services/ekyc-service

  transfer-service:
    build:
      context: ./services/transfer-service
      dockerfile: Dockerfile
    container_name: poc-transfer-service
    ports:
      - "8085:8080"
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: app
      DB_PASSWORD: temporary-password-123
      DB_NAME: app
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./services/transfer-service

  # =========================================================================
  # BACKEND FOR FRONTEND (BFF) SERVICE
  # =========================================================================
  bff-service:
    build:
      context: ./services/bff-service
      dockerfile: Dockerfile
    container_name: poc-bff-service
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8080}
      BANK_ACCOUNT_SERVICE_URL: ${BANK_ACCOUNT_SERVICE_URL:-http://bank-account-service:8080}
      EKYC_SERVICE_URL: ${EKYC_SERVICE_URL:-http://ekyc-service:8080}
      TRANSFER_SERVICE_URL: ${TRANSFER_SERVICE_URL:-http://transfer-service:8080}
      SMS_SERVICE_URL: ${SMS_SERVICE_URL:-http://sms-service:8080}
    depends_on:
      - user-service
      - bank-account-service
      - ekyc-service
      - transfer-service
      - sms-service
    develop:
      watch:
        - action: rebuild
          path: ./services/bff-service

  # =========================================================================
  # QA WEBSITE (browser e2e for QA)
  # =========================================================================
  website:
    build:
      context: ./services/website
      dockerfile: Dockerfile
    container_name: poc-website
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      BFF_URL: ${BFF_URL:-http://localhost:8080}
    depends_on:
      - bff-service
    develop:
      watch:
        - action: rebuild
          path: ./services/website
        - action: sync
          path: ./services/website/public
          target: /app/public

volumes:
  postgres-data-v18:
